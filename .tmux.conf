set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0

# unbind stupid thing
unbind-key C-\\
unbind -n C-\\

# change prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

unbind r
bind r source-file ~/.tmux.conf

bind x kill-session

# creating panes
unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

# vim-like pane switching
bind -r ^ last-window
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind m resize-pane -Z

# scripts
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer.sh"

bind-key -r X run-shell "~/.local/bin/tmux-clear-sessions.sh"

# clear
# Use prefix C-l to clear the visible scrollback lines
bind C-l send-keys 'C-l'

# Use prefix C-k to clear the scrolled off (hidden) buffer lines
bind C-k clear-history

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-left-icon "#h | #S"
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
