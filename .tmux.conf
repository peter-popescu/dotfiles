## set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# change prefix
unbind C-b
set -g prefix C-Space
# bind-key C-Space send-prefix

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows on delete
set-option -g renumber-windows on

# fix vim mode switch delay
## set -sg escape-time 10

# reload
## unbind r
## bind r source-file ~/.tmux.conf

# creating panes
unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

# vim-like pane switching
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -r C-h resize-pane -L 5

unbind l
bind -r l last-window

unbind z
bind m resize-pane -Z

# unbind stupid thing
unbind-key C-\\
unbind -n C-\\

# session picker
bind-key -r f run-shell 'sesh connect "$(sesh list --icons | fzf-tmux -p 80%,70% \
  --no-sort --ansi --border-label " sesh " --prompt "⚡  " \
  --header "  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find" \
  --bind "tab:down,btab:up" \
  --bind "ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)" \
  --bind "ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)" \
  --bind "ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)" \
  --bind "ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)" \
  --bind "ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)" \
  --bind "ctrl-f:change-prompt(🔎  )+reload(fd -H -d 4 -t d -E .Trash -E Library -E .git -E node_modules -E .cache . ~)" \
  --preview-window "right:55%" \
  --preview "sesh preview {}")"'

# window picker
bind-key "W" run-shell 'selection="$(sesh window | fzf-tmux -p 60%,50% --prompt "🪟  ")"; if [ -n "$selection" ]; then sesh window "$selection" || :; fi'

# sesh recommendations
bind-key x kill-pane  # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last" # always find last session
set-hook -g session-created 'run-shell -b "sesh rename --enrich"' # add issue name (shouldn't hurt)
# git worktrees i think?
bind -N "switch to root session (via sesh) " _ run-shell "sesh connect --root $(pwd)" # connect to root

# scripts
bind-key -r X run-shell "~/.local/bin/tmux-clear-sessions.sh"

# interaction
set -g mouse on
set-window-option -g mode-keys vi

# copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle # Begin selection in copy mode.
# bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# clipboard
set -s set-clipboard on
set -g allow-passthrough on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# tmux plugins
set -g @plugin 'tmux-plugins/tmux-sensible' # reasonable defaults
# double commented lines denote things done inside, keeping for now in case of problems later

set -g @plugin 'christoomey/vim-tmux-navigator' # movement

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @continuum-restore 'on'

set -g @plugin 'dracula/tmux' # theme
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-left-icon "#h | #S"

set -g @plugin 'tmux-plugins/tmux-open' # open links and files

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'tmux set-buffer -w -- "{}"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
